<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Mein Aquarium – 3D Druck</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef2f5;
    color: #111;
}

header {
    background: white;
    padding: 18px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

#viewer {
    width: 100%;
    height: 55vh;
    background: linear-gradient(#b9e7ff, #eafaff);
    position: relative;
    overflow: hidden;
}

#hint {
    position: absolute;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,.55);
    color: white;
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 13px;
    pointer-events: none;
}

.panel {
    background: white;
    margin: 15px;
    padding: 18px;
    border-radius: 18px;
    box-shadow: 0 3px 15px rgba(0,0,0,.08);
}

.row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #eee;
}

.row:last-child {
    border-bottom: none;
}

button {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    font-size: 17px;
    font-weight: bold;
    margin-top: 10px;
    background: #1677ff;
    color: white;
}

button:active {
    transform: scale(.98);
}

#download {
    background: #222;
}
</style>
</head>

<body>

<header>
🐟 Mein Aquarium
</header>

<div id="viewer">

    <div id="hint">
        👆 Mit dem Finger drehen
    </div>

</div>

<div class="panel">

    <h2>Maße</h2>

    <div class="row">
        <span>Breite</span>
        <b>100 mm</b>
    </div>

    <div class="row">
        <span>Länge</span>
        <b>100 mm</b>
    </div>

    <div class="row">
        <span>Höhe</span>
        <b>40 mm</b>
    </div>

    <div class="row">
        <span>Innen</span>
        <b>90 × 90 mm</b>
    </div>

    <div class="row">
        <span>Boden</span>
        <b>10 mm</b>
    </div>

</div>

<div class="panel">

    <button id="download">
        STL erstellen
    </button>

    <button id="print">
        🖨️ Für Bambu Studio vorbereiten
    </button>

</div>


<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
}
</script>

<script type="module">

import * as THREE from "three";

import { OrbitControls } from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";


// =====================================
// SZENE
// =====================================

const container =
document.getElementById("viewer");

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0xb9e7ff);


// =====================================
// KAMERA
// =====================================

const camera =
new THREE.PerspectiveCamera(
    45,
    container.clientWidth /
    container.clientHeight,
    0.1,
    1000
);

camera.position.set(
    150,
    120,
    150
);


// =====================================
// RENDERER
// =====================================

const renderer =
new THREE.WebGLRenderer({
    antialias: true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    container.clientWidth,
    container.clientHeight
);

renderer.shadowMap.enabled = true;

container.appendChild(
    renderer.domElement
);


// =====================================
// DREHEN / ZOOM
// =====================================

const controls =
new OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;

controls.enablePan = false;

controls.minDistance = 100;
controls.maxDistance = 350;


// =====================================
// LICHT
// =====================================

const ambient =
new THREE.AmbientLight(
    0xffffff,
    2
);

scene.add(ambient);


const light =
new THREE.DirectionalLight(
    0xffffff,
    3
);

light.position.set(
    100,
    200,
    100
);

light.castShadow = true;

scene.add(light);


// =====================================
// AQUARIUM / BOX
// =====================================

// Maße in mm
const outerWidth = 100;
const outerLength = 100;
const outerHeight = 40;

const innerWidth = 90;
const innerLength = 90;

const bottomThickness = 10;


// Material
const material =
new THREE.MeshStandardMaterial({
    color: 0x72a7c4,
    roughness: 0.35,
    metalness: 0.05
});


// =====================================
// BODEN
// =====================================

const bottom =
new THREE.Mesh(
    new THREE.BoxGeometry(
        outerWidth,
        bottomThickness,
        outerLength
    ),
    material
);

bottom.position.y =
bottomThickness / 2;

bottom.castShadow = true;
bottom.receiveShadow = true;

scene.add(bottom);


// =====================================
// WÄNDE
// =====================================

const wallHeight =
outerHeight - bottomThickness;

const wallThickness = 5;


// Linke Wand
const wallLeft =
new THREE.Mesh(
    new THREE.BoxGeometry(
        wallThickness,
        wallHeight,
        outerLength
    ),
    material
);

wallLeft.position.set(
    -47.5,
    bottomThickness + wallHeight / 2,
    0
);

scene.add(wallLeft);


// Rechte Wand
const wallRight =
wallLeft.clone();

wallRight.position.x = 47.5;

scene.add(wallRight);


// Hintere Wand
const wallBack =
new THREE.Mesh(
    new THREE.BoxGeometry(
        innerWidth,
        wallHeight,
        wallThickness
    ),
    material
);

wallBack.position.set(
    0,
    bottomThickness + wallHeight / 2,
    47.5
);

scene.add(wallBack);


// Vordere Wand
const wallFront =
wallBack.clone();

wallFront.position.z = -47.5;

scene.add(wallFront);


// =====================================
// BODEN DER SZENE
// =====================================

const floor =
new THREE.Mesh(
    new THREE.PlaneGeometry(
        500,
        500
    ),
    new THREE.MeshStandardMaterial({
        color: 0xdce8ed
    })
);

floor.rotation.x =
-Math.PI / 2;

floor.position.y = -0.1;

scene.add(floor);


// =====================================
// AQUARIUM ZENTRIEREN
// =====================================

scene.position.set(
    0,
    0,
    0
);


// =====================================
// STL ERSTELLEN
// =====================================

function createSTL() {

    const vertices = [];

    function triangle(a,b,c) {

        vertices.push(
            a.x,a.y,a.z,
            b.x,b.y,b.z,
            c.x,c.y,c.z
        );
    }


    // Ein Quader als STL
    function box(x1,y1,z1,x2,y2,z2) {

        const v = [
            new THREE.Vector3(x1,y1,z1),
            new THREE.Vector3(x2,y1,z1),
            new THREE.Vector3(x2,y2,z1),
            new THREE.Vector3(x1,y2,z1),

            new THREE.Vector3(x1,y1,z2),
            new THREE.Vector3(x2,y1,z2),
            new THREE.Vector3(x2,y2,z2),
            new THREE.Vector3(x1,y2,z2)
        ];

        // unten
        triangle(v[0],v[1],v[2]);
        triangle(v[0],v[2],v[3]);

        // oben
        triangle(v[4],v[6],v[5]);
        triangle(v[4],v[7],v[6]);

        // vorne
        triangle(v[0],v[4],v[5]);
        triangle(v[0],v[5],v[1]);

        // hinten
        triangle(v[3],v[2],v[6]);
        triangle(v[3],v[6],v[7]);

        // links
        triangle(v[0],v[3],v[7]);
        triangle(v[0],v[7],v[4]);

        // rechts
        triangle(v[1],v[5],v[6]);
        triangle(v[1],v[6],v[2]);
    }


    // Boden
    box(
        -50, 0, -50,
         50, 10, 50
    );


    // linke Wand
    box(
        -50, 10, -50,
        -45, 40, 50
    );


    // rechte Wand
    box(
        45, 10, -50,
        50, 40, 50
    );


    // vordere Wand
    box(
        -45, 10, -50,
        45, 40, -45
    );


    // hintere Wand
    box(
        -45, 10, 45,
        45, 40, 50
    );


    let stl =
`solid aquarium\n`;

    for (
        let i = 0;
        i < vertices.length;
        i += 9
    ) {

        const ax = vertices[i];
        const ay = vertices[i+1];
        const az = vertices[i+2];

        const bx = vertices[i+3];
        const by = vertices[i+4];
        const bz = vertices[i+5];

        const cx = vertices[i+6];
        const cy = vertices[i+7];
        const cz = vertices[i+8];


        const ab = new THREE.Vector3(
            bx-ax,
            by-ay,
            bz-az
        );

        const ac = new THREE.Vector3(
            cx-ax,
            cy-ay,
            cz-az
        );

        const normal =
        new THREE.Vector3()
        .crossVectors(ab,ac)
        .normalize();


        stl +=
`facet normal ${normal.x} ${normal.y} ${normal.z}
 outer loop
  vertex ${ax} ${ay} ${az}
  vertex ${bx} ${by} ${bz}
  vertex ${cx} ${cy} ${cz}
 endloop
endfacet
`;
    }

    stl +=
`endsolid aquarium`;

    return stl;
}


// =====================================
// STL DOWNLOAD
// =====================================

document
.getElementById("download")
.addEventListener("click", () => {

    const stl =
    createSTL();

    const blob =
    new Blob(
        [stl],
        {type:"model/stl"}
    );

    const url =
    URL.createObjectURL(blob);

    const a =
    document.createElement("a");

    a.href = url;

    a.download =
    "aquarium_100x100x40mm.stl";

    a.click();

    URL.revokeObjectURL(url);
});


// =====================================
// BAMBU BUTTON
// =====================================

document
.getElementById("print")
.addEventListener("click", () => {

    const stl =
    createSTL();

    const blob =
    new Blob(
        [stl],
        {type:"model/stl"}
    );

    const url =
    URL.createObjectURL(blob);

    const a =
    document.createElement("a");

    a.href = url;

    a.download =
    "aquarium_bambu.stl";

    a.click();

    URL.revokeObjectURL(url);

    alert(
        "Die STL wurde erstellt. Öffne sie anschließend in Bambu Studio bzw. Bambu Handy."
    );
});


// =====================================
// RESIZE
// =====================================

window.addEventListener(
"resize",
() => {

    camera.aspect =
    container.clientWidth /
    container.clientHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        container.clientWidth,
        container.clientHeight
    );

});


// =====================================
// ANIMATION
// =====================================

function animate() {

    requestAnimationFrame(
        animate
    );

    controls.update();

    renderer.render(
        scene,
        camera
    );
}

animate();

</script>

</body>
</html>
