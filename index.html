<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Pixel-Zensur</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}

h1{
  font-size:22px;
  margin:15px 0;
}

#upload{
  display:none;
}

.uploadBtn{
  display:inline-block;
  background:#333;
  padding:12px 18px;
  border-radius:12px;
  cursor:pointer;
  margin-bottom:15px;
}

#preview{
  position:relative;
  width:calc(100% - 20px);
  max-width:800px;
  margin:auto;
  overflow:hidden;
  border-radius:12px;
  background:#222;
}

#image{
  width:100%;
  display:block;
  user-select:none;
  -webkit-user-drag:none;
}

.pixelBox{
  position:absolute;
  pointer-events:none;
  image-rendering:pixelated;
}

.controls{
  width:calc(100% - 30px);
  max-width:600px;
  margin:20px auto;
  background:#222;
  padding:15px;
  border-radius:15px;
}

label{
  display:block;
  margin:12px 0 5px;
}

input[type=range]{
  width:100%;
}

.value{
  font-weight:bold;
}

button{
  margin-top:15px;
  padding:11px 18px;
  border:0;
  border-radius:10px;
  background:#444;
  color:white;
  font-size:16px;
}
</style>
</head>

<body>

<h1>🟪 Pixel-Zensur</h1>

<label class="uploadBtn" for="upload">
  📷 Bild auswählen
</label>

<input id="upload" type="file" accept="image/*">

<div id="preview">
  <img id="image">
</div>

<div class="controls">

  <label>
    Quadratgröße:
    <span class="value" id="sizeValue">20%</span>
  </label>

  <input id="size" type="range" min="5" max="80" value="20">

  <label>
    Pixelstärke:
    <span class="value" id="pixelValue">10</span>
  </label>

  <input id="pixel" type="range" min="2" max="30" value="10">

  <button onclick="clearBoxes()">Alle Quadrate löschen</button>

</div>

<script>

const upload = document.getElementById("upload");
const image = document.getElementById("image");
const preview = document.getElementById("preview");

const sizeSlider = document.getElementById("size");
const pixelSlider = document.getElementById("pixel");

const sizeValue = document.getElementById("sizeValue");
const pixelValue = document.getElementById("pixelValue");

let boxes = [];

upload.addEventListener("change", function(){

  const file = this.files[0];

  if(!file) return;

  const url = URL.createObjectURL(file);

  image.onload = function(){
    boxes = [];
    removeBoxes();
  };

  image.src = url;
});

preview.addEventListener("click", function(e){

  if(!image.src) return;

  const rect = preview.getBoundingClientRect();

  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  const percentX = x / rect.width * 100;
  const percentY = y / rect.height * 100;

  boxes.push({
    x:percentX,
    y:percentY
  });

  drawBoxes();
});

sizeSlider.addEventListener("input", function(){
  sizeValue.textContent = this.value + "%";
  drawBoxes();
});

pixelSlider.addEventListener("input", function(){
  pixelValue.textContent = this.value;
  drawBoxes();
});

function drawBoxes(){

  removeBoxes();

  const size = Number(sizeSlider.value);

  boxes.forEach(box => {

    const element = document.createElement("canvas");

    element.className = "pixelBox";

    const width = preview.clientWidth * size / 100;
    const height = width;

    element.style.width = width + "px";
    element.style.height = height + "px";

    element.style.left =
      (box.x / 100 * preview.clientWidth - width/2) + "px";

    element.style.top =
      (box.y / 100 * preview.clientHeight - height/2) + "px";

    element.width = pixelSlider.value;
    element.height = pixelSlider.value;

    const ctx = element.getContext("2d");

    ctx.imageSmoothingEnabled = false;

    const temp = document.createElement("canvas");
    const tempCtx = temp.getContext("2d");

    temp.width = 100;
    temp.height = 100;

    const imageRect = image.getBoundingClientRect();

    const sx =
      box.x / 100 * image.naturalWidth -
      (size/100 * image.naturalWidth)/2;

    const sy =
      box.y / 100 * image.naturalHeight -
      (size/100 * image.naturalWidth)/2;

    const sw = size/100 * image.naturalWidth;

    tempCtx.drawImage(
      image,
      sx, sy, sw, sw,
      0, 0, 100, 100
    );

    ctx.drawImage(
      temp,
      0,0,100,100,
      0,0,
      element.width,
      element.height
    );

    preview.appendChild(element);
  });
}

function removeBoxes(){

  document.querySelectorAll(".pixelBox").forEach(
    el => el.remove()
  );
}

function clearBoxes(){

  boxes = [];
  removeBoxes();

}

window.addEventListener("resize", drawBoxes);

</script>

</body>
</html>
